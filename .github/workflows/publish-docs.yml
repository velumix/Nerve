name: Publish documentation

on:
  pull_request:
    paths:
      - ".github/workflows/publish-docs.yml"
      - ".moonwave/**"
      - "docs/**"
      - "src/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "moonwave.toml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-docs.yml"
      - ".moonwave/**"
      - "docs/**"
      - "src/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "moonwave.toml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nerve-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install documentation tooling
        run: npm ci

      - name: Build documentation
        run: npm run docs:build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
