[home]
enabled = true
includeReadme = true

[[home.features]]
title = "Everything in one package"
description = "Services, controllers, networking, React UI, profiles, promises, signals, cleanup, components, input, and data utilities travel together."

[[home.features]]
title = "Contracts become packets"
description = "Declare typed methods and signals beside each service. Nerve turns the contract into deterministic ByteNet packets for both realms."

[[home.features]]
title = "Safe by default"
description = "Timeouts, bounded requests, rate limits, sanitized errors, schema validation, and explicit signal direction are part of the framework."

