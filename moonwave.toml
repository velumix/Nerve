[home]
enabled = true
includeReadme = true

[[home.features]]
title = "One package"
description = "Services, controllers, ByteNet networking, persistence, promises, signals, cleanup, components, input, and data utilities ship together."

[[home.features]]
title = "Typed networking"
description = "Declare schemas next to service contracts and let Nerve construct deterministic ByteNet packets for methods and signals."

[[home.features]]
title = "Production safeguards"
description = "Request timeouts, bounded in-flight calls, server rate limits, sanitized errors, and explicit signal direction are built in."

